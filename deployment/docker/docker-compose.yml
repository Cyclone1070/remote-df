services:
  app:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    ports:
      - "8484:8484"
      - "8485:8485"
    environment:
      - PORT=8484
      - STREAM_PORT=8485
      - GAMES_DIR=/app/games
      - WEB_ROOT=/app/client
      - MODE=self-hosted
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8484/api/config"]
      interval: 3s
      timeout: 3s
      retries: 5
